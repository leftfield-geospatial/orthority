name: Tests (conda-forge)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # run weekly

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        python-version: [ '3.10', '3.14' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          activate-environment: orthority-test
          conda-solver: libmamba

      - name: Install dependencies
        run: |
          conda info
          conda install -q rasterio "opencv <5 headless*" numpy click tqdm pyyaml fsspec requests aiohttp threadpoolctl rio-cogeo pytest pytest-xdist
          conda list

      - name: Run unit tests
        run: |
          python -m pytest -vv -n auto ./tests
